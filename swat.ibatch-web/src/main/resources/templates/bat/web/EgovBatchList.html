<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Job 실행 템플릿 예제 List(DB)</title>
<link type="text/css" rel="stylesheet" th:href="@{/css/egovframework/batch.css}"/>
<script type="text/javascript" language="javascript" defer="defer">
/* Job 실행 function */
function fn_egov_batchRun() {
   	document.listForm.submit();		
}
</script>
</head>
<body style="text-align:center; margin:0 auto; display:inline; padding-top:100px;">
<div id="content_pop">
	<!-- 타이틀 -->
	<div id="title">
		<ul>
			<li><img th:src="@{/images/egovframework/batch/title_dot.gif}" alt="" /> Job 실행 템플릿 List </li>
		</ul>
	</div>
	<!-- Job List -->
	<form id="listForm" name="listForm" method="post" th:action="@{/batchRun.do}">
	<div id="table">
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<colgroup>
				<col width="40"/>				
				<col width="50"/>
				<col width="%"/>
			</colgroup>		  
			<tr>
				<th align="center">No</th>
				<th align="center">작업선택</th>
				<th align="center">Job 이름</th>
			</tr>
			<tr th:each="item, iterStat : ${jobList}">      
				<td align="center" class="listtd" th:text="${iterStat.count}"></td>
				<td align="center" class="listtd">
					<input type="radio" name="jobName" th:value="${item}" th:checked="${iterStat.first}"/>
				</td>
				<td align="center" class="listtd" th:text="${item}">&nbsp;</td>
			</tr>
		</table>
	</div>
	</form>
	<!-- /Job List -->
	<!--  Button -->
	<div id="sysbtn1">
		<ul>
            <li>
        		<div id="sysbtn">
                    <ul>
                        <li>
                            <span class="btn_blue_l">
                                <a href="javascript:fn_egov_batchRun();">배치실행</a>
                                <img th:src="@{/images/egovframework/batch/btn_bg_r.gif}" style="margin-left:6px;" alt="" />
                            </span>
                        </li>
                    </ul>
        		</div>
            </li>
		</ul>
	</div>
</div>
</body>
</html>
